# Netlify Configuration — Lettres de Mission OEC

[build]
  publish = "."
  functions = "functions"

# Serveur SPA — redirect all routes to index.html
[[redirects]]
  from   = "/*"
  to     = "/src/index.html"
  status = 200

# Environment variables (à configurer dans Netlify UI)
[env]
  NOTION_TOKEN = ""
  NOTION_DATABASE_ID = ""
  ONEDRIVE_CLIENT_ID = ""
  ONEDRIVE_CLIENT_SECRET = ""
  ONEDRIVE_TENANT_ID = ""
  ONEDRIVE_CABINET_FOLDER_ID = ""
  JESIGNEEXPERT_API_KEY = ""
  JESIGNEEXPERT_WEBHOOK_SECRET = ""
  CABINET_NAME = "Cabinet Expertise Comptable"
  AUDIT_ENABLED = "true"
  AUDIT_RETENTION_DAYS = "2555"

# Header de sécurité RGPD
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data:"
