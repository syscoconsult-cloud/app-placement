{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<div class="carte connexion">
  <h1>⏰ Suivi des échéances</h1>
  <form method="post" class="champs" style="grid-template-columns: 1fr">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Adresse e-mail <input type="email" name="email" required autofocus></label>
    <label>Mot de passe <input type="password" name="mot_de_passe" required></label>
    <button type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
