<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prévisualisation LDM — Lettres de Mission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="js/config.js"></script>
  <script src="js/audit.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0A1628; --teal: #0D9488; --red: #DC2626; --green: #16A34A;
      --yellow: #F59E0B; --bg: #F1F5F9; --white: #FFFFFF; --text: #0F172A;
      --muted: #64748B; --border: #E2E8F0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--navy);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }

    .app-logo {
      width: 36px;
      height: 36px;
      background: var(--teal);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--white);
    }

    header a {
      margin-left: auto;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 0.84rem;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    main {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 20px 60px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .pdf-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pdf-iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 8px;
    }

    .pdf-placeholder {
      text-align: center;
      color: var(--muted);
    }

    .pdf-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .sidebar {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      height: fit-content;
    }

    .sidebar-title {
      font-size: 0.84rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .info-block {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .info-block:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .info-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 500;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.84rem;
    }

    .alert.warning {
      background: #FEF3C7;
      border-left: 4px solid var(--yellow);
      color: #92400E;
    }

    .alert.success {
      background: #F0FDF4;
      border-left: 4px solid var(--green);
      color: #166534;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .btn-primary {
      background: var(--teal);
      color: white;
    }

    .btn-primary:hover {
      background: #0B7A70;
    }

    .btn-primary:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--teal);
      border: 1px solid var(--teal);
    }

    .btn-secondary:hover {
      background: rgba(13, 148, 136, 0.05);
    }

    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
    }

    .btn-danger:hover {
      background: rgba(220, 38, 38, 0.05);
    }

    .checkbox-group {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.84rem;
      margin-top: 12px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <div class="app-logo">📋</div>
    <h1>Prévisualisation Lettre de Mission</h1>
    <a href="new-mission.html?edit=true">← Éditer</a>
  </header>

  <main>
    <!-- PDF Preview -->
    <div class="pdf-container">
      <div id="pdfPreview" class="pdf-placeholder">
        <div class="pdf-icon">📄</div>
        <p>Génération en cours...</p>
      </div>
    </div>

    <!-- Sidebar Info -->
    <aside class="sidebar">
      <h2 class="sidebar-title">Informations</h2>

      <div class="alert warning" id="alertValidation" style="display: none;">
        ⚠️ Vérifiez les données avant signature
      </div>

      <div class="info-block">
        <div class="info-label">Prospect</div>
        <div class="info-value" id="infoProspect">-</div>
      </div>

      <div class="info-block">
        <div class="info-label">Type de mission</div>
        <div class="info-value" id="infoMission">-</div>
      </div>

      <div class="info-block">
        <div class="info-label">Organisation</div>
        <div class="info-value" id="infoOrganisation">-</div>
      </div>

      <div class="info-block">
        <div class="info-label">Tarif annuel</div>
        <div class="info-value" id="infoTarif">-</div>
      </div>

      <div class="info-block">
        <div class="info-label">Statut</div>
        <div class="info-value" style="color: var(--yellow);">🟡 En cours de validation</div>
      </div>

      <div class="alert success" style="display: none; margin-bottom: 0;" id="alertReady">
        ✅ Prêt pour signature
      </div>

      <div class="actions">
        <button class="btn btn-secondary" onclick="goBack()">← Retour</button>
        <button class="btn btn-primary" id="btnSignature" onclick="sendToSignature()" disabled>
          Envoyer à signature
        </button>
        <button class="btn btn-danger" onclick="downloadPDF()">
          ⬇️ Télécharger PDF
        </button>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="confirmData" onchange="validateConsent()" />
        <label for="confirmData" style="cursor: pointer; margin: 0;">
          Confirmer les données
        </label>
      </div>
    </aside>
  </main>

  <script>
    const auditLogger = new AuditLogger(window.APP_CONFIG.audit);
    let missionData = {};
    let pdfUrl = null;

    async function init() {
      // Récupérer données mission du sessionStorage
      const storedData = sessionStorage.getItem('missionData');
      if (!storedData) {
        alert('Erreur: données mission manquantes. Retour au formulaire.');
        window.location.href = 'new-mission.html';
        return;
      }

      missionData = JSON.parse(storedData);
      displayInfo();

      // Générer PDF LDM
      await generatePDF();
    }

    function displayInfo() {
      document.getElementById('infoProspect').textContent = missionData.nom;
      document.getElementById('infoMission').textContent = missionData.missionType
        .replace(/-/g, ' ');
      document.getElementById('infoOrganisation').textContent = missionData.organisation;
      document.getElementById('infoTarif').textContent = `${missionData.tarif} €`;
    }

    async function generatePDF() {
      try {
        // Appel backend pour générer PDF
        const response = await fetch('/.netlify/functions/generate-ldm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(missionData),
        });

        if (!response.ok) {
          throw new Error('Erreur génération PDF');
        }

        const data = await response.json();
        pdfUrl = data.pdfUrl;

        // Afficher PDF
        const pdfPreview = document.getElementById('pdfPreview');
        pdfPreview.innerHTML = `
          <iframe
            src="${pdfUrl}"
            class="pdf-iframe"
          ></iframe>
        `;

        // Enable signature button
        document.getElementById('btnSignature').disabled = false;
        document.getElementById('alertReady').style.display = 'block';

        // Log audit
        await auditLogger.logLDMGenerated(missionData.prospectId, 'hash_placeholder');
      } catch (err) {
        console.error('Erreur génération PDF:', err);
        const pdfPreview = document.getElementById('pdfPreview');
        pdfPreview.innerHTML = `
          <div style="color: var(--red);">
            <div class="pdf-icon">❌</div>
            <p>Erreur génération LDM</p>
            <p style="font-size: 0.8rem; margin-top: 8px;">${err.message}</p>
          </div>
        `;
      }
    }

    function validateConsent() {
      const confirmed = document.getElementById('confirmData').checked;
      document.getElementById('btnSignature').disabled = !confirmed;
    }

    async function sendToSignature() {
      try {
        document.getElementById('btnSignature').disabled = true;
        const originalText = document.getElementById('btnSignature').textContent;
        document.getElementById('btnSignature').innerHTML =
          '<span class="spinner"></span>Envoi en cours...';

        // Backend appel JeSigneExpert
        const response = await fetch('/.netlify/functions/send-to-signature', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            missionId: missionData.prospectId,
            pdfUrl: pdfUrl,
            clientEmail: missionData.email,
            clientName: missionData.nom,
          }),
        });

        if (!response.ok) {
          throw new Error('Erreur envoi signature');
        }

        const data = await response.json();

        // Log audit
        await auditLogger.logSignatureSent(missionData.prospectId, data.jeSigneExpertId);

        // Rediriger vers tracking
        sessionStorage.setItem('missionId', missionData.prospectId);
        sessionStorage.setItem('jeSigneExpertId', data.jeSigneExpertId);
        window.location.href = `tracking.html?id=${missionData.prospectId}`;
      } catch (err) {
        console.error('Erreur envoi signature:', err);
        alert('❌ Erreur: ' + err.message);
        document.getElementById('btnSignature').disabled = false;
        document.getElementById('btnSignature').textContent = 'Envoyer à signature';
      }
    }

    function downloadPDF() {
      if (pdfUrl) {
        const a = document.createElement('a');
        a.href = pdfUrl;
        a.download = `LDM_${missionData.nom}_${new Date().toISOString().split('T')[0]}.pdf`;
        a.click();
      }
    }

    function goBack() {
      if (confirm('Retourner au formulaire ? Les données seront conservées.')) {
        window.location.href = 'new-mission.html?edit=true';
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
